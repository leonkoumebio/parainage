<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QuizGain – Prototype</title>
<style id="st">
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#667;--ac:#0a7d4f;--bd:#dde1e6;--bad:#c62828}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171a;--card:#1e2327;--tx:#eef1f4;--mut:#9aa4ad;--ac:#3ecf8e;--bd:#2d343a;--bad:#ef6b6b}}
:root[data-theme="dark"]{--bg:#14171a;--card:#1e2327;--tx:#eef1f4;--mut:#9aa4ad;--ac:#3ecf8e;--bd:#2d343a;--bad:#ef6b6b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:480px;margin:0 auto;padding:56px 16px 100px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:17px;margin:0 0 8px}
input,button{font:inherit;border-radius:10px;border:1px solid var(--bd);padding:12px;width:100%;box-sizing:border-box;background:var(--bg);color:var(--tx)}
button{background:var(--ac);color:#fff;border:0;font-weight:600;margin-top:8px;cursor:pointer}
button.alt{background:transparent;color:var(--ac);border:1px solid var(--ac)}
button.red{background:var(--bad)}
button.opt{background:var(--bg);color:var(--tx);border:1px solid var(--bd);text-align:left;font-weight:500}
.row{display:flex;gap:8px}.row button{flex:1}
.bal{font-size:34px;font-weight:700;color:var(--ac)}
.mut{color:var(--mut);font-size:14px}.bad{color:var(--bad)}
.tag{display:inline-block;background:var(--ac);color:#fff;border-radius:6px;padding:2px 8px;font-size:12px;margin-bottom:8px}
code{background:var(--bg);padding:2px 6px;border-radius:6px;word-break:break-all}
.bar{height:8px;background:var(--bg);border-radius:6px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ac)}
.tx{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bd);font-size:14px}
.pos{color:var(--ac)}.neg{color:var(--bad)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{background:none;color:var(--mut);margin:0;border:0;border-radius:0;padding:6px 0;font-size:12px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button.on{color:var(--ac);font-weight:700}
nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cp{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:12px;width:44px;height:44px;padding:0;margin:0;display:flex;align-items:center;justify-content:center;border-radius:12px;background:var(--card);color:var(--ac);border:1px solid var(--bd);z-index:8}
.cp svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;z-index:9}
</style></head><body><button class="cp" id="cp" aria-label="Copier tout le code" onclick="copySrc()"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V6a2 2 0 0 1 2-2h9"></path></svg></button><main id="app"></main><nav id="nav"></nav>
<script id="js">
const Q=[
["Quelle est la capitale du Sénégal ?",["Dakar","Abidjan","Bamako","Conakry"],0],
["Combien de continents y a-t-il ?",["5","6","7","8"],2],
["Quel est le plus long fleuve d’Afrique ?",["Niger","Nil","Congo","Zambèze"],1],
["Qui a écrit « Les Misérables » ?",["Zola","Hugo","Balzac","Camus"],1],
["Quelle planète est la plus proche du Soleil ?",["Vénus","Mars","Mercure","Terre"],2],
["En quelle année a eu lieu la première Coupe du monde de football en Afrique ?",["2006","2010","2014","2002"],1],
["Quel est le plus grand océan ?",["Atlantique","Indien","Arctique","Pacifique"],3],
["Quelle est la capitale du Cameroun ?",["Douala","Yaoundé","Garoua","Bafoussam"],1],
["Combien font 12 × 12 ?",["122","124","144","164"],2],
["Quel gaz respirons-nous principalement ?",["Oxygène","Azote","Hydrogène","Gaz carbonique"],1],
["Qui était le premier président du Ghana ?",["Nkrumah","Senghor","Houphouët-Boigny","Lumumba"],0],
["Quel pays a pour capitale Nairobi ?",["Tanzanie","Ouganda","Kenya","Éthiopie"],2]];
const BONUS=3500,REF=500,GAIN=100,PERDAY=5,MINW=5000,KEY="quizgain_proto";
let S=null,qi=null,tab="home",msg="";
try{S=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const today=()=>new Date().toISOString().slice(0,10);
const f=n=>n.toLocaleString("fr-FR")+" F";
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2000)}
async function copy(t,label){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(e2){}a.remove()}toast(label)}
function src(){return '<!DOCTYPE html>\n<html lang="fr"><head><meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n<title>QuizGain – Prototype</title>\n<style id="st">'+document.getElementById("st").textContent+'</style></head><body>'+document.getElementById("cp").outerHTML+'<main id="app"></main><nav id="nav"></nav>\n<script id="js">'+document.getElementById("js").textContent+'<\/script></body></html>'}
function share(){const t="Rejoins QuizGain et utilise mon code de parrainage : "+S.code;if(navigator.share){navigator.share({text:t}).catch(()=>{})}else copy(t,"Message copié")}
function copySrc(){copy(src(),"Code complet copié")}
function go(t){tab=t;msg="";qi=null;render()}
function add(label,n){S.bal+=n;S.hist.unshift([label,n]);save()}
function signup(){
 const name=document.getElementById("n").value.trim();
 const ref=document.getElementById("r").value.trim().toUpperCase();
 if(!name){msg="Entre ton prénom.";return render()}
 S={name,code:name.slice(0,3).toUpperCase().replace(/[^A-Z]/g,"X")+Math.floor(100+Math.random()*900),bal:BONUS,kids:0,day:today(),done:0,ref:ref||null,hist:[["Bonus de bienvenue",BONUS]]};
 save();tab="home";msg=ref?"Code "+ref+" enregistré : ton parrain recevra "+f(REF)+" (simulé).":"";render()}
function start(){if(S.day!==today()){S.day=today();S.done=0}
 if(S.done>=PERDAY){msg="Quota du jour atteint. Reviens demain !";return render()}
 qi=Math.floor(Math.random()*Q.length);msg="";render()}
function answer(i){const ok=i===Q[qi][2];S.done++;
 if(ok){add("Bonne réponse",GAIN);msg="✅ Bravo, +"+f(GAIN)}else{save();msg="❌ Raté. Bonne réponse : "+Q[qi][1][Q[qi][2]]}
 qi=null;render()}
function fake(){S.kids++;add("Filleul inscrit (simulation)",REF);toast("+"+f(REF));render()}
function amount(){return parseInt(document.getElementById("amt").value,10)||0}
function deposit(){const a=amount();if(a<=0){msg="Entre un montant valide.";return render()}add("Dépôt (fictif)",a);msg="Dépôt de "+f(a)+" effectué.";render()}
function withdraw(){const a=amount();
 if(a<=0)msg="Entre un montant valide.";
 else if(a<MINW)msg="Retrait minimum : "+f(MINW)+".";
 else if(a>S.bal)msg="Solde insuffisant.";
 else{add("Retrait (fictif)",-a);msg="Retrait de "+f(a)+" simulé."}
 render()}
function reset(){if(confirm("Tout effacer ?")){S=null;msg="";try{localStorage.removeItem(KEY)}catch(e){}render()}}
const ic={
home:'<svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>',
tasks:'<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l3 3 5-6"/></svg>',
wallet:'<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18"/><circle cx="16.5" cy="15" r="1"/></svg>'};
function hist(n){return S.hist.slice(0,n).map(x=>'<div class="tx"><span>'+x[0]+'</span><b class="'+(x[1]<0?'neg':'pos')+'">'+(x[1]<0?'−':'+')+f(Math.abs(x[1]))+'</b></div>').join("")}
function render(){
 const a=document.getElementById("app"),nv=document.getElementById("nav");
 const note='<p class="mut">⚠️ Prototype : l’argent est <b>fictif</b>, aucun paiement réel.</p>';
 if(!S){nv.innerHTML="";a.innerHTML='<h1>QuizGain</h1><div class="card"><h2>Inscription</h2><p class="mut">Reçois '+f(BONUS)+' fictifs à l’inscription.</p><input id="n" placeholder="Ton prénom"><div style="height:8px"></div><input id="r" placeholder="Code de parrainage (facultatif)"><button onclick="signup()">Créer mon compte</button><p class="bad">'+msg+'</p></div>'+note;return}
 if(S.day!==today()){S.day=today();S.done=0}
 nv.innerHTML=[["home","Accueil"],["tasks","Tâches"],["wallet","Portefeuille"]].map(t=>'<button class="'+(tab===t[0]?'on':'')+'" onclick="go(\''+t[0]+'\')">'+ic[t[0]]+t[1]+'</button>').join("");
 let h="";
 if(tab==="home"){
  h='<h1>Salut '+S.name+' 👋</h1><div class="card"><div class="mut">Solde (fictif)</div><div class="bal">'+f(S.bal)+'</div><p class="mut">Tâches du jour : '+S.done+'/'+PERDAY+' · Filleuls : '+S.kids+'</p><button onclick="go(\'tasks\')">Faire une tâche</button></div>'
  +(msg?'<p class="mut">'+msg+'</p>':'')
  +'<div class="card"><h2>Parrainage</h2><p class="mut">Gagne '+f(REF)+' par filleul inscrit avec ton code.</p><p>Ton code : <code>'+S.code+'</code></p><div class="row"><button onclick="copy(S.code,\'Code copié\')">Copier</button><button class="alt" onclick="share()">Partager</button></div><button class="alt" onclick="fake()">Simuler un nouveau filleul</button></div>'
  +'<div class="card"><h2>Activité récente</h2>'+hist(4)+'</div>'+note}
 else if(tab==="tasks"){
  h='<h1>Tâches</h1>';
  if(qi!==null){const q=Q[qi];h+='<div class="card"><span class="tag">Question '+(S.done+1)+'/'+PERDAY+'</span><h2>'+q[0]+'</h2>'+q[1].map((o,i)=>'<button class="opt" onclick="answer('+i+')">'+o+'</button>').join("")+'</div>'}
  else h+='<div class="card"><h2>Quiz du jour</h2><div class="bar"><i style="width:'+S.done/PERDAY*100+'%"></i></div><p class="mut">'+S.done+'/'+PERDAY+' questions · +'+f(GAIN)+' par bonne réponse</p>'+(msg?'<p>'+msg+'</p>':'')+(S.done<PERDAY?'<button onclick="start()">'+(S.done?'Question suivante':'Commencer')+'</button>':'<p class="mut">Quota atteint, reviens demain !</p>')+'</div>';
  h+=note}
 else{
  h='<h1>Portefeuille</h1><div class="card"><div class="mut">Solde (fictif)</div><div class="bal">'+f(S.bal)+'</div></div>'
  +'<div class="card"><h2>Dépôt / Retrait</h2><input id="amt" type="number" inputmode="numeric" placeholder="Montant en F"><div class="row"><button onclick="deposit()">Déposer</button><button class="alt" onclick="withdraw()">Retirer</button></div><p class="mut">Retrait minimum : '+f(MINW)+'. Simulation uniquement.</p>'+(msg?'<p>'+msg+'</p>':'')+'</div>'
  +'<div class="card"><h2>Historique</h2>'+hist(20)+'</div>'
  +'<div class="card"><h2>Outils</h2><button class="alt red" style="color:#fff" onclick="reset()">Réinitialiser le compte</button></div>'+note}
 a.innerHTML=h}
render();
</script></body></html>
